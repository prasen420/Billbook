<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BillBook</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f7a4d;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .header span {
            font-size: 14px;
        }

        .container {
            padding: 25px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
        }

        .menu {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .menu button {
            border: none;
            background: white;
            padding: 25px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .menu button:hover {
            background: #e9f7ef;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .menu {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>BillBook</h1>
        <span>Billing & Business Management</span>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Dashboard</h2>
            <p>Welcome to your BillBook software</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Today's Sales</h3>
                <p>₹ 0</p>
            </div>

            <div class="card">
                <h3>Today's Purchase</h3>
                <p>₹ 0</p>
            </div>

            <div class="card">
                <h3>Total Due</h3>
                <p>₹ 0</p>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <p>0</p>
            </div>

        </div>

        <div class="menu">

            <button>🧾 New Bill</button>

            <button>📦 Products</button>

            <button>👤 Customers</button>

            <button>💰 Payments</button>

            <button>📊 Reports</button>

            <button>⚙️ Settings</button>

        </div>

    </div>

</body>
</html>
